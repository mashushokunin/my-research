# Default Jetson runtime configuration.

robot_id: jetson-01

# Camera input. Use camera_backend: gstreamer and gst_pipeline for CSI cameras
# when a plain V4L2 device number is not sufficient.
camera_device: 0
camera_width: 1280
camera_height: 720
camera_fps: 30
camera_backend: auto
gst_pipeline:

# Capture control. Set one of these to stop capture automatically.
max_frames: 300
duration_sec:
sequence_name: jetson_live
save_frames: true

# ORB-SLAM3 execution. Keep run_orbslam false when you only want to capture
# frames and run scripts/run_orbslam3_monocular.py later.
run_orbslam: false
orbslam_root: ../external-repos/ORB_SLAM3
pangolin_build: ../external-repos/Pangolin/build
settings: configs/orbslam3/iphone_vertical_1080x1920_approx.yaml
vocabulary: ../external-repos/ORB_SLAM3/Vocabulary/ORBvoc.txt
binary: ../external-repos/ORB_SLAM3/Examples/Monocular/mono_tum

output_dir: results/jetson

features:
  max_keypoints: 1000

communication:
  enabled: false
  host: 127.0.0.1
  port: 5000
  publish_interval_sec: 1.0
